# @package _global_
# Named alias of the deployment-only MPPI schedule, also the V2 default.
steps: 50000
residual_rl:
  freeze_tdmpc2_on_start: true
mpr_mpc:
  stages:
    residual_start_step: 20000
    mppi_start_step: 50000
milestone_checkpoints:
  world_model_step: 20000
  world_model_residual_step: 50000
  full_model_step: 50000
eval_freq: 10000
